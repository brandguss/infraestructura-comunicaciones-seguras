name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run automated tests
        run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Run VPN demonstration
        run: python -m src.comunicaciones_seguras.vpn_demo
